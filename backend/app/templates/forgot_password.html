{% extends "base.html" %}
{% block title %}Lupa kata sandi | Algentra Capital{% endblock %}
{% block content %}
<main id="main" tabindex="-1" class="page-shell login-shell">
  <section class="login-card">
    <span class="eyebrow">PORTAL KLIEN / RESET KATA SANDI</span>
    <h1>Lupa kata sandi?</h1>
    <form id="reset-request-form">
      <label for="reset-email">Email akun</label>
      <input id="reset-email" type="email" autocomplete="email" required>
      <fieldset class="otp-channel-picker">
        <legend>Kirim kode melalui</legend>
        <div class="otp-channel-options">
          <label class="otp-channel-option" for="reset-channel-email">
            <input id="reset-channel-email" type="radio" name="reset-channel" value="email" checked>
            <span class="otp-channel-option__icon" aria-hidden="true"><svg viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="14" rx="2"></rect><path d="m4.5 7 7.5 6 7.5-6"></path></svg></span>
            <span class="otp-channel-option__copy"><span class="otp-channel-option__name">Gmail</span></span>
            <span class="otp-channel-option__indicator" aria-hidden="true"></span>
          </label>
          <label class="otp-channel-option" for="reset-channel-whatsapp">
            <input id="reset-channel-whatsapp" type="radio" name="reset-channel" value="whatsapp">
            <span class="otp-channel-option__icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M20 11.5a8 8 0 0 1-11.8 7L4 20l1.5-4A8 8 0 1 1 20 11.5Z"></path><path d="M9 8.5c.5 2.3 2.2 4 4.5 4.5l1.1-1.1 2 .9-.2 1.7c-.1.6-.6 1-1.2 1-4.3-.3-7.9-3.9-8.2-8.2 0-.6.4-1.1 1-1.2l1.7-.2.9 2L9 8.5Z"></path></svg></span>
            <span class="otp-channel-option__copy"><span class="otp-channel-option__name">WhatsApp</span></span>
            <span class="otp-channel-option__indicator" aria-hidden="true"></span>
          </label>
        </div>
      </fieldset>
      <button type="submit">Kirim kode reset</button>
    </form>
    <form id="reset-confirm-form" hidden>
      <label for="reset-code">Kode reset</label>
      <input id="reset-code" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6" required>
      <label for="new-password">Kata sandi baru</label>
      <input id="new-password" type="password" autocomplete="new-password" minlength="8" required>
      <label for="confirm-password">Ulangi kata sandi baru</label>
      <input id="confirm-password" type="password" autocomplete="new-password" minlength="8" required>
      <button type="submit">Simpan kata sandi baru</button>
      <button id="reset-resend" class="secondary" type="button">Kirim ulang kode</button>
    </form>
    <button id="change-reset-email" class="secondary" type="button" hidden>Ubah email atau metode</button>
    <p id="reset-message" class="status" role="status" aria-live="polite"></p>
    <p id="reset-success" class="muted" hidden><a href="/login">Masuk dengan kata sandi baru</a></p>
    <p class="muted"><a href="/login">Kembali ke halaman masuk</a></p>
  </section>
</main>
{% endblock %}
{% block scripts %}
<script nonce="{{ request.state.csp_nonce }}">
const requestForm = document.querySelector("#reset-request-form");
const confirmForm = document.querySelector("#reset-confirm-form");
const resetMessage = document.querySelector("#reset-message");
const resendButton = document.querySelector("#reset-resend");
const changeButton = document.querySelector("#change-reset-email");
let resetEmail = "";
let resetChannel = "email";

function selectedResetChannel() {
  return document.querySelector('input[name="reset-channel"]:checked').value;
}

async function postReset(path, body) {
  const response = await fetch(path, {
    method: "POST",
    headers: {"Content-Type":"application/json"},
    body: JSON.stringify(body)
  });
  const result = await parseApiResponse(response);
  if (!response.ok) {
    const error = new Error(result.detail || "Permintaan gagal. Coba lagi.");
    error.retryAfter = Number(response.headers.get("Retry-After")) || Number(result.retry_after_seconds) || 0;
    throw error;
  }
  return result;
}

function acceptedMessage() {
  return resetChannel === "whatsapp"
    ? "Jika akun, nomor terverifikasi, dan bot tersedia, kode reset akan dikirim melalui WhatsApp."
    : "Jika akun dan email terverifikasi tersedia, kode reset akan dikirim melalui Gmail. Periksa juga folder spam.";
}

async function requestCode() {
  resendButton.disabled = true;
  try {
    const result = await postReset("/api/auth/password-reset/request", {email: resetEmail, channel: resetChannel});
    requestForm.hidden = true;
    confirmForm.hidden = false;
    changeButton.hidden = false;
    startResendCountdown(resendButton, result.retry_after_seconds, "Kirim ulang kode");
    resetMessage.textContent = acceptedMessage();
  } catch (error) {
    resetMessage.textContent = error.message;
    if (error.retryAfter) {
      const targetButton = confirmForm.hidden ? requestForm.querySelector('button[type="submit"]') : resendButton;
      startResendCountdown(targetButton, error.retryAfter, confirmForm.hidden ? "Kirim kode reset" : "Kirim ulang kode");
    } else resendButton.disabled = false;
  }
}

requestForm.addEventListener("submit", async (event) => {
  event.preventDefault();
  resetEmail = document.querySelector("#reset-email").value.trim();
  resetChannel = selectedResetChannel();
  const button = requestForm.querySelector('button[type="submit"]');
  button.disabled = true;
  await requestCode();
  if (!button._resendTimer) button.disabled = false;
});

resendButton.addEventListener("click", requestCode);

changeButton.addEventListener("click", () => {
  confirmForm.hidden = true;
  changeButton.hidden = true;
  requestForm.hidden = false;
  resetMessage.textContent = "";
});

confirmForm.addEventListener("submit", async (event) => {
  event.preventDefault();
  const password = document.querySelector("#new-password").value;
  if (password !== document.querySelector("#confirm-password").value) {
    resetMessage.textContent = "Konfirmasi kata sandi tidak sama.";
    return;
  }
  const button = confirmForm.querySelector('button[type="submit"]');
  button.disabled = true;
  try {
    await postReset("/api/auth/password-reset/confirm", {
      email: resetEmail,
      channel: resetChannel,
      code: document.querySelector("#reset-code").value,
      password
    });
    confirmForm.hidden = true;
    requestForm.hidden = true;
    changeButton.hidden = true;
    document.querySelector("#reset-success").hidden = false;
    resetMessage.textContent = "Kata sandi berhasil direset. Sesi lama sudah dicabut.";
  } catch (error) {
    resetMessage.textContent = error.message;
    if (error.retryAfter) startResendCountdown(resendButton, error.retryAfter, "Kirim ulang kode");
  } finally { button.disabled = false; }
});
</script>
{% endblock %}
