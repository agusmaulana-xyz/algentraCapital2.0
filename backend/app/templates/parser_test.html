{% extends "base.html" %}
{% block title %}Parser Test | Algentra Capital{% endblock %}
{% block extra_head %}

{% endblock %}
{% block content %}
<main id="main" tabindex="-1" class="page-shell">
    <div class="page-heading"><div><span class="eyebrow">Signal lab</span><h1>Tes Parser Signal</h1></div></div>
    <form id="parser-form">
      <label for="message">Pesan baru</label>
      <textarea id="message" required placeholder="Contoh: XAUUSD BUY 4100:::4093, TP 4120, SL 4085"></textarea>
      <label for="context">Konteks pesan sebelumnya (opsional)</label>
      <textarea id="context" placeholder="Contoh: BUY NOW"></textarea>
      <button type="submit">Parse pesan</button>
    </form>
    <h2>Hasil parsing</h2>
    <pre id="result" aria-live="polite">Masukkan pesan untuk menguji parser.</pre>
  </main>
{% endblock %}
{% block scripts %}
<script nonce="{{ request.state.csp_nonce }}">
document.querySelector("#parser-form").addEventListener("submit", async (event) => {
      event.preventDefault();
      const output = document.querySelector("#result");
      output.textContent = "Memproses…";
      try {
        const response = await fetch("/api/parser/test", {
          method: "POST",
          headers: { "Content-Type": "application/json", "X-CSRF-Token": document.querySelector('meta[name="csrf-token"]').content },
          body: JSON.stringify({
            message: document.querySelector("#message").value,
            context: document.querySelector("#context").value || null
          })
        });
        const payload = await parseApiResponse(response);
        if (!response.ok) throw new Error(payload.detail || `Request gagal (HTTP ${response.status})`);
        output.textContent = JSON.stringify(payload, null, 2);
      } catch (error) {
        output.textContent = error.message;
      }
    });
</script>
{% endblock %}
